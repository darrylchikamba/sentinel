services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: sentinel-api

    ports:
      - "8000:8000"

    env_file:
      - server/.env

    volumes:
      - ./server:/app
      - ./server/knowledge_base/chroma_db:/app/knowledge_base/chroma_db

    depends_on:
      - chromadb

  chromadb:
    image: chromadb/chroma:0.5.10

    container_name: sentinel-chromadb

    ports:
      - "8001:8000"

    volumes:
      - chroma_data:/chroma/chroma

volumes:
  chroma_data: