name: Test and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      MONGO_URI: mongodb://localhost:27017/sentinel_test
      JWT_SECRET: sentinel-ci-only-secret-not-for-production
      FRONTEND_URL: http://localhost:5173
      MOCK_AI: "true"
      AI_GENERATION_PROVIDER: mock
      AI_EMBEDDING_PROVIDER: none
      SENTINEL_EMBEDDING_DIM: "768"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend dependencies
        run: pip install -r server/requirements.txt

      - name: Run backend test suite
        working-directory: server
        run: pytest tests/ -v

  deploy:
    name: Trigger Render deployment
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl --fail --show-error --silent             -X POST "$RENDER_DEPLOY_HOOK"
